# Run from the project root:
#   Local / simple:   docker compose -f deployment/docker-compose.yml --env-file .env up --build
#   With HTTPS proxy: docker compose -f deployment/docker-compose.yml --env-file .env --profile proxy up -d --build

name: url_shortener

x-app-env: &app-env
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  DEBUG: "False"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  BASE_SHORT_URL: ${BASE_SHORT_URL:-http://localhost:8000}
  HTTPS_ENABLED: ${HTTPS_ENABLED:-False}
  ANALYTICS_TRUST_PROXY: ${ANALYTICS_TRUST_PROXY:-False}
  POSTGRES_DB: ${POSTGRES_DB:-shortener}
  POSTGRES_USER: ${POSTGRES_USER:-shortener}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_EAGER: "False"

x-app-build: &app-build
  context: .
  dockerfile: deployment/Dockerfile

services:
  web:
    build: *app-build
    image: url_shortener:latest
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000 --workers 3 --access-logfile -
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
    ports:
      # Local default: reachable on all interfaces.
      # Production: set WEB_BIND=127.0.0.1:8000 so only the proxy is public.
      - "${WEB_BIND:-0.0.0.0:8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request as u; h=os.environ.get('ALLOWED_HOSTS','localhost').split(',')[0]; u.urlopen(u.Request('http://127.0.0.1:8000/admin/login/', headers={'Host': h}), timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: url_shortener:latest
    command: celery -A config worker -l info
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shortener}
      POSTGRES_USER: ${POSTGRES_USER:-shortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shortener} -d ${POSTGRES_DB:-shortener}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Reverse proxy with automatic HTTPS (Let's Encrypt). Enabled with --profile proxy.
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
